[project]
name = "ecommerce-drf-api"
version = "1.0.0"
description = "E-commerce REST API on Django REST Framework with Click and Payme payments."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Samandar Hamrayev" }]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "N", "SIM", "RUF", "BLE", "C4", "PIE", "PT"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S324"]
"conftest.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "users", "products", "carts", "orders", "reviews", "payments"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["config", "core", "users", "products", "carts", "orders", "reviews", "payments"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
